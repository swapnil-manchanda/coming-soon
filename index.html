<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swapnil Manchanda – Coming Soon</title>
  <meta name="description" content="My personal website is on its way.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e8effb;
      --text: #14213d;
      --muted: #46577f;
      --accent: #6d28d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101a3a;
        --text: #f5f3ff;
        --muted: #aeb8dc;
        --accent: #ffb703;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main { max-width: 34rem; }
    h1 {
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
      margin: 0 0 1rem;
      font-size: clamp(2.5rem, 9vw, 4.5rem);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 1.5rem; color: var(--muted); font-size: 1.15rem; }
    p.intro { color: var(--text); font-size: 1.3rem; }
    a {
      color: var(--accent);
      text-underline-offset: 0.25em;
    }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Something new is on the way.</h1>
    <p class="intro">Hi, I'm Swapnil Manchanda, a London-based data, technology and finance enthusiast.</p>
    <p>I'm building my personal website. Check back soon, or get in touch in the meantime.</p>
    <a href="mailto:swap.manch@gmail.com">swap.manch@gmail.com</a>
  </main>
</body>
</html>
